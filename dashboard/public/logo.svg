<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Globe -->
  <circle cx="256" cy="256" r="200" fill="url(#globeGrad)"/>

  <!-- Latitude ellipses -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="200" ry="140" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Longitude ellipses -->
  <ellipse cx="256" cy="256" rx="70" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="140" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Horizontal equator line -->
  <line x1="56" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Vertical center line -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Clip to keep everything inside the circle -->
  <clipPath id="circleClip">
    <circle cx="256" cy="256" r="200"/>
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Upward trending arrow line -->
    <path d="M 146 320 L 216 260 L 256 300 L 356 190"
          fill="none" stroke="#ffffff" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead -->
    <path d="M 320 178 L 366 178 L 366 224"
          fill="none" stroke="#ffffff" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
