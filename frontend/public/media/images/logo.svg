<svg width="1600" height="480" viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="240" cy="240" r="190"/>
    </clipPath>
  </defs>

  <!-- Globe -->
  <circle cx="240" cy="240" r="190" fill="url(#globeGrad)"/>

  <!-- Latitude ellipses -->
  <ellipse cx="240" cy="240" rx="190" ry="66" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="240" cy="240" rx="190" ry="133" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Longitude ellipses -->
  <ellipse cx="240" cy="240" rx="66" ry="190" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="240" cy="240" rx="133" ry="190" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Equator + center lines -->
  <line x1="50" y1="240" x2="430" y2="240" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="240" y1="50" x2="240" y2="430" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g clip-path="url(#circleClip)">
    <!-- Upward trending arrow line -->
    <path d="M 130 305 L 200 245 L 240 285 L 340 175"
          fill="none" stroke="#ffffff" stroke-width="17"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead -->
    <path d="M 300 165 L 350 165 L 350 215"
          fill="none" stroke="#ffffff" stroke-width="17"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="270" font-family="Arial, Helvetica, sans-serif" font-size="130" font-weight="700" fill="#0f172a">TradeSphere</text>

  <!-- Tagline -->
  <text x="503" y="335" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="6" fill="#64748b">STOCK TRADING PLATFORM</text>
</svg>
